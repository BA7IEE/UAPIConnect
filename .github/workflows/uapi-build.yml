name: U-API Connect build and validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  UAPI_CONNECT_DISTRIBUTION: "1"

concurrency:
  group: uapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Distribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate distribution manifest
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: Audit customization surface
        run: bash scripts/uapi/audit-upstream-surface.sh
      - name: Validate shell scripts
        run: |
          bash -n scripts/uapi/audit-upstream-surface.sh
          bash -n scripts/uapi/package-macos-dmg.sh

  windows:
    name: Windows x64
    needs: policy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Install pinned NSIS
        shell: pwsh
        run: |
          choco install nsis `
            --version=3.12.0 `
            --allow-downgrade `
            --source=https://community.chocolatey.org/api/v2/ `
            --yes `
            --no-progress
          $chocoExitCode = $LASTEXITCODE
          if (@(0, 1641, 3010) -notcontains $chocoExitCode) {
            throw "Chocolatey failed to install NSIS 3.12.0 (exit $chocoExitCode)"
          }

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "Pinned makensis was not installed at $makensis"
          }
          $compilerVersion = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne "v3.12") {
            throw "Expected makensis v3.12, got '$compilerVersion'"
          }
      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci
      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"
      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check
      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked
      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/uapi/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/uapi/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/uapi/windows/app/
      - name: Prepare verified WebView2 bootstrapper
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2Setup.exe"
          [string]$bootstrapper = ./scripts/uapi/prepare-webview2.ps1 -OutputPath $outputPath
          if ([string]::IsNullOrWhiteSpace($bootstrapper)) {
            throw "WebView2 bootstrapper preparation did not return a path"
          }
          "UAPI_WEBVIEW2_BOOTSTRAPPER=$bootstrapper" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build installer
        shell: pwsh
        run: |
          $versionMatch = Select-String -Path "Cargo.toml" -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1
          if (-not $versionMatch) { throw "Cannot read workspace version from Cargo.toml" }
          $baseVersion = $versionMatch.Matches[0].Groups[1].Value
          $version = "$baseVersion-uapi.${{ github.run_number }}"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "Pinned makensis is missing at $makensis"
          }
          $compilerVersion = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne "v3.12") {
            throw "Expected pinned makensis v3.12 before compilation, got '$compilerVersion'"
          }
          $makensisArguments = @(
            "/INPUTCHARSET",
            "UTF8",
            "/DVERSION=$version",
            "/DWEBVIEW2_BOOTSTRAPPER=$env:UAPI_WEBVIEW2_BOOTSTRAPPER",
            "UAPIConnect.nsi"
          )
          Push-Location scripts/uapi/installer/windows
          try {
            & $makensis @makensisArguments
            if ($LASTEXITCODE -ne 0) {
              throw "makensis exited with $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }
      - name: Smoke test installer lifecycle
        shell: pwsh
        run: ./scripts/uapi/tests/windows-installer-lifecycle.ps1
      - name: Upload validated Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uapi-connect-windows-x64
          path: dist/uapi/windows/*.exe
          if-no-files-found: error
      - name: Upload failed Windows installer for diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uapi-connect-windows-x64-unvalidated
          path: dist/uapi/windows/*.exe
          if-no-files-found: ignore
          retention-days: 3

  macos:
    name: macOS ${{ matrix.arch }}
    needs: policy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci
      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"
      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check
      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package DMG
        env:
          BINARY_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: |
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$base_version"
          bash scripts/uapi/package-macos-dmg.sh "${base_version}-uapi.${GITHUB_RUN_NUMBER}" "${{ matrix.arch }}"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uapi-connect-macos-${{ matrix.arch }}
          path: dist/uapi/macos/*.dmg
          if-no-files-found: error
