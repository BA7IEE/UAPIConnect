name: U-API Connect build and validation

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Distribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate distribution manifest
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: Audit customization surface
        run: bash scripts/uapi/audit-upstream-surface.sh
      - name: Validate shell scripts
        run: |
          bash -n scripts/uapi/audit-upstream-surface.sh
          bash -n scripts/uapi/package-macos-dmg.sh

  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      UAPI_CONNECT_DISTRIBUTION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci
      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"
      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check
      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release
      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/uapi/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/uapi/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/uapi/windows/app/
      - name: Build installer
        shell: pwsh
        run: |
          $version = "1.2.49-uapi.${{ github.run_number }}"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "makensis" }
          Push-Location scripts/uapi/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" UAPIConnect.nsi
          Pop-Location
      - name: Smoke test installer lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "dist/uapi/windows/UAPIConnect-*-windows-x64-setup.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced" }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\U-API Connect"
          $launcher = Join-Path $installDir "codex-plus-plus.exe"
          $manager = Join-Path $installDir "codex-plus-plus-manager.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          $desktop = [Environment]::GetFolderPath("Desktop")
          $programs = [Environment]::GetFolderPath("Programs")
          $desktopLauncher = Join-Path $desktop "U-API Connect.lnk"
          $desktopManager = Join-Path $desktop "U-API Connect 设置.lnk"
          $startMenuDir = Join-Path $programs "U-API Connect"
          $startMenuLauncher = Join-Path $startMenuDir "U-API Connect.lnk"
          $startMenuManager = Join-Path $startMenuDir "U-API Connect 设置.lnk"
          $startMenuUninstaller = Join-Path $startMenuDir "卸载 U-API Connect.lnk"
          $productKey = "Registry::HKEY_CURRENT_USER\Software\UAPIConnect"
          $uninstallKey = "Registry::HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Uninstall\UAPIConnect"
          $protocolRoot = "Registry::HKEY_CURRENT_USER\Software\Classes\uapiconnect"
          $protocolKey = "Registry::HKEY_CURRENT_USER\Software\Classes\uapiconnect\shell\open\command"

          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }

          $requiredPaths = @(
            $launcher,
            $manager,
            $uninstaller,
            $desktopLauncher,
            $desktopManager,
            $startMenuLauncher,
            $startMenuManager,
            $startMenuUninstaller,
            $productKey,
            $uninstallKey,
            $protocolRoot,
            $protocolKey
          )
          $missing = $requiredPaths | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Installer omitted: $($missing -join ', ')" }

          # WScript.Shell cannot reliably reopen shortcuts whose names contain CJK text.
          $shell = New-Object -ComObject Shell.Application
          function Get-ShortcutTarget {
            param([string]$ShortcutPath)
            $folder = $shell.Namespace((Split-Path -Parent $ShortcutPath))
            if ($null -eq $folder) {
              throw "Cannot open shortcut folder: $ShortcutPath"
            }
            $item = $folder.ParseName((Split-Path -Leaf $ShortcutPath))
            if ($null -eq $item) {
              throw "Cannot find shortcut through Windows Shell: $ShortcutPath"
            }
            $link = $item.GetLink
            if ($null -eq $link -or [string]::IsNullOrWhiteSpace($link.Path)) {
              throw "Cannot resolve shortcut through Windows Shell: $ShortcutPath"
            }
            return [System.IO.Path]::GetFullPath([string]$link.Path)
          }
          $shortcutTargets = @(
            [pscustomobject]@{ Path = $desktopLauncher; Target = $launcher }
            [pscustomobject]@{ Path = $desktopManager; Target = $manager }
            [pscustomobject]@{ Path = $startMenuLauncher; Target = $launcher }
            [pscustomobject]@{ Path = $startMenuManager; Target = $manager }
            [pscustomobject]@{ Path = $startMenuUninstaller; Target = $uninstaller }
          )
          function Assert-ShortcutTargets {
            foreach ($entry in $shortcutTargets) {
              $target = Get-ShortcutTarget -ShortcutPath $entry.Path
              $expectedTarget = [System.IO.Path]::GetFullPath($entry.Target)
              if ($target -ne $expectedTarget) {
                throw "Unexpected shortcut target for $($entry.Path): $target; expected $expectedTarget"
              }
            }
          }
          Assert-ShortcutTargets

          $protocolCommand = (Get-Item -LiteralPath $protocolKey).GetValue("")
          $expectedProtocolCommand = '"' + $manager + '" "%1"'
          if ($protocolCommand -ne $expectedProtocolCommand) {
            throw "Unexpected protocol command: $protocolCommand"
          }

          $helper = Start-Process -FilePath $launcher -ArgumentList "--helper-only" -PassThru
          Start-Sleep -Seconds 2
          if ($helper.HasExited) { throw "Installed launcher helper exited before upgrade" }
          $upgrade = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade exited with $($upgrade.ExitCode)" }
          if (-not $helper.WaitForExit(5000)) {
            Stop-Process -Id $helper.Id -Force
            throw "Upgrade did not stop the running launcher"
          }
          $missingAfterUpgrade = $requiredPaths |
            Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missingAfterUpgrade) {
            throw "Upgrade omitted: $($missingAfterUpgrade -join ', ')"
          }
          Assert-ShortcutTargets

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with $($uninstall.ExitCode)" }
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            $remaining = @(
              $installDir,
              $launcher,
              $manager,
              $uninstaller,
              $desktopLauncher,
              $desktopManager,
              $startMenuDir,
              $startMenuLauncher,
              $startMenuManager,
              $startMenuUninstaller,
              $productKey,
              $uninstallKey,
              $protocolRoot,
              $protocolKey
            ) | Where-Object { Test-Path -LiteralPath $_ }
            if (-not $remaining) { break }
            Start-Sleep -Milliseconds 500
          }
          if ($remaining) { throw "Uninstaller left behind: $($remaining -join ', ')" }
      - name: Upload validated Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: uapi-connect-windows-x64
          path: dist/uapi/windows/*.exe
          if-no-files-found: error
      - name: Upload failed Windows installer for diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uapi-connect-windows-x64-unvalidated
          path: dist/uapi/windows/*.exe
          if-no-files-found: ignore
          retention-days: 3

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci
      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"
      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check
      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust tests
        run: cargo test --workspace
      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package DMG
        env:
          BINARY_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        run: bash scripts/uapi/package-macos-dmg.sh "1.2.49-uapi.${GITHUB_RUN_NUMBER}" "${{ matrix.arch }}"
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: uapi-connect-macos-${{ matrix.arch }}
          path: dist/uapi/macos/*.dmg
          if-no-files-found: error
