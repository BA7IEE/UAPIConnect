name: U-API Connect release assets

on:
  push:
    tags:
      - "v*-uapi.*"

permissions:
  contents: read

env:
  UAPI_CONNECT_DISTRIBUTION: "1"

concurrency:
  group: uapi-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  policy:
    name: Distribution policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          base_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$base_version"
          if [[ "$GITHUB_REF_NAME" != "v${base_version}-uapi."* ]] || \
             [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-uapi\.[0-9]+$ ]]; then
            echo "::error::Release tag must match v${base_version}-uapi.<number>"
            exit 1
          fi
      - name: Require a merged main commit
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit already merged into main"
            exit 1
          fi
      - name: Validate distribution policy
        run: node --test scripts/uapi/tests/distribution.test.mjs
      - name: Audit customization surface
        run: bash scripts/uapi/audit-upstream-surface.sh
      - name: Validate scripts
        run: |
          bash -n scripts/uapi/audit-upstream-surface.sh
          bash -n scripts/uapi/package-macos-dmg.sh

  windows-installer:
    name: Windows x64 release
    needs: policy
    runs-on: windows-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install pinned NSIS
        shell: pwsh
        run: |
          choco install nsis `
            --version=3.12.0 `
            --allow-downgrade `
            --source=https://community.chocolatey.org/api/v2/ `
            --yes `
            --no-progress
          $chocoExitCode = $LASTEXITCODE
          if (@(0, 1641, 3010) -notcontains $chocoExitCode) {
            throw "Chocolatey failed to install NSIS 3.12.0 (exit $chocoExitCode)"
          }

          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "Pinned makensis was not installed at $makensis"
          }
          $compilerVersion = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne "v3.12") {
            throw "Expected makensis v3.12, got '$compilerVersion'"
          }

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"

      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Stage application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/uapi/windows/app | Out-Null
          Copy-Item target/release/codex-plus-plus.exe dist/uapi/windows/app/
          Copy-Item target/release/codex-plus-plus-manager.exe dist/uapi/windows/app/

      - name: Prepare verified WebView2 bootstrapper
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebView2Setup.exe"
          [string]$bootstrapper = ./scripts/uapi/prepare-webview2.ps1 -OutputPath $outputPath
          if ([string]::IsNullOrWhiteSpace($bootstrapper)) {
            throw "WebView2 bootstrapper preparation did not return a path"
          }
          "UAPI_WEBVIEW2_BOOTSTRAPPER=$bootstrapper" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare optional Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if (-not $hasCertificate -and -not $hasPassword) {
            "UAPI_WINDOWS_SIGNING=0" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Authenticode secrets are not configured; producing an unsigned release."
            exit 0
          }
          if ($hasCertificate -ne $hasPassword) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must be configured together"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "uapi-authenticode.pfx"
          $importedCertificates = @()
          try {
            $base64 = $env:WINDOWS_CERTIFICATE `
              -replace "-----BEGIN [A-Z0-9 ]+-----", "" `
              -replace "-----END [A-Z0-9 ]+-----", "" `
              -replace "\s", ""
            $pfxBytes = [Convert]::FromBase64String($base64)
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $securePassword = ConvertTo-SecureString `
              -String $env:WINDOWS_CERTIFICATE_PASSWORD `
              -AsPlainText `
              -Force
            $importedCertificates = @(
              Import-PfxCertificate `
                -FilePath $pfxPath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword
            )

            $now = Get-Date
            $codeSigningOid = "1.3.6.1.5.5.7.3.3"
            $signingCertificates = @(
              $importedCertificates |
                Where-Object {
                  $ekuOids = @($_.EnhancedKeyUsageList | ForEach-Object { $_.ObjectId.Value })
                  $_.HasPrivateKey -and
                    $_.NotBefore -le $now -and
                    $_.NotAfter -gt $now -and
                    $ekuOids -contains $codeSigningOid
                }
            )
            if ($signingCertificates.Count -ne 1) {
              throw "PFX must contain exactly one current certificate with a private key and Code Signing EKU"
            }
            $certificate = $signingCertificates[0]

            $signToolCommand = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if ($null -ne $signToolCommand) {
              $signToolPath = $signToolCommand.Source
            } else {
              $signTool = Get-ChildItem `
                -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
                -File `
                -ErrorAction SilentlyContinue |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($null -eq $signTool) {
                throw "Cannot find the Windows SDK signtool.exe"
              }
              $signToolPath = $signTool.FullName
            }

            $importedThumbprints = @(
              $importedCertificates |
                ForEach-Object { $_.Thumbprint } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                Sort-Object -Unique
            )
            "UAPI_WINDOWS_SIGNING=1" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "UAPI_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "UAPI_IMPORTED_CERT_THUMBPRINTS=$($importedThumbprints -join ',')" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "UAPI_SIGNTOOL_PATH=$signToolPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Authenticode certificate imported for this release."
          } catch {
            foreach ($importedCertificate in $importedCertificates) {
              $certificatePath = "Cert:\CurrentUser\My\$($importedCertificate.Thumbprint)"
              if (Test-Path -LiteralPath $certificatePath) {
                Remove-Item -LiteralPath $certificatePath -Force
              }
            }
            throw
          } finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Sign staged Windows binaries
        if: env.UAPI_WINDOWS_SIGNING == '1'
        shell: pwsh
        run: |
          $files = @(
            "dist/uapi/windows/app/codex-plus-plus.exe",
            "dist/uapi/windows/app/codex-plus-plus-manager.exe"
          )
          foreach ($file in $files) {
            & $env:UAPI_SIGNTOOL_PATH sign `
              /fd SHA256 `
              /sha1 $env:UAPI_SIGNING_THUMBPRINT `
              /d "U-API Connect" `
              /tr "http://timestamp.digicert.com" `
              /td SHA256 `
              $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed to sign $file with exit code $LASTEXITCODE"
            }
            & $env:UAPI_SIGNTOOL_PATH verify /pa /all /v $file
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed to verify $file with exit code $LASTEXITCODE"
            }
          }

      - name: Build U-API Connect installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^[vV]', ''
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis)) {
            throw "Pinned makensis is missing at $makensis"
          }
          $compilerVersion = (& $makensis /VERSION 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $compilerVersion -ne "v3.12") {
            throw "Expected pinned makensis v3.12 before compilation, got '$compilerVersion'"
          }
          $makensisArguments = @(
            "/INPUTCHARSET",
            "UTF8",
            "/DVERSION=$version",
            "/DWEBVIEW2_BOOTSTRAPPER=$env:UAPI_WEBVIEW2_BOOTSTRAPPER"
          )
          if ($env:UAPI_WINDOWS_SIGNING -eq "1") {
            $makensisArguments += "/DSIGNTOOL_PATH=$env:UAPI_SIGNTOOL_PATH"
            $makensisArguments += "/DSIGN_CERTIFICATE_THUMBPRINT=$env:UAPI_SIGNING_THUMBPRINT"
          }
          $makensisArguments += "UAPIConnect.nsi"
          Push-Location scripts/uapi/installer/windows
          try {
            & $makensis @makensisArguments
            if ($LASTEXITCODE -ne 0) {
              throw "makensis exited with $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

      - name: Sign U-API Connect installer
        if: env.UAPI_WINDOWS_SIGNING == '1'
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem "dist/uapi/windows/UAPIConnect-*-windows-x64-setup.exe"
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)"
          }
          $installer = $installers[0].FullName
          & $env:UAPI_SIGNTOOL_PATH sign `
            /fd SHA256 `
            /sha1 $env:UAPI_SIGNING_THUMBPRINT `
            /d "U-API Connect" `
            /tr "http://timestamp.digicert.com" `
            /td SHA256 `
            $installer
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the installer with exit code $LASTEXITCODE"
          }
          & $env:UAPI_SIGNTOOL_PATH verify /pa /all /v $installer
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to verify the installer with exit code $LASTEXITCODE"
          }

      - name: Validate installer lifecycle
        shell: pwsh
        run: ./scripts/uapi/tests/windows-installer-lifecycle.ps1

      - name: Remove imported Authenticode certificate
        if: ${{ always() && env.UAPI_WINDOWS_SIGNING == '1' }}
        shell: pwsh
        run: |
          foreach ($thumbprint in ($env:UAPI_IMPORTED_CERT_THUMBPRINTS -split ',')) {
            if ([string]::IsNullOrWhiteSpace($thumbprint)) { continue }
            $certificatePath = "Cert:\CurrentUser\My\$thumbprint"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Stage validated Windows release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uapi-release-windows-x64
          path: dist/uapi/windows/UAPIConnect-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3

  macos-dmg:
    name: macOS ${{ matrix.arch }} release
    needs: policy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/codex-plus-manager/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: node --experimental-strip-types --test "src/*.test.ts"

      - name: Distribution tests
        run: node --test scripts/uapi/tests/distribution.test.mjs

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Frontend build
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package U-API Connect DMG
        env:
          BINARY_DIR: ${{ github.workspace }}/target/${{ matrix.target }}/release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash scripts/uapi/package-macos-dmg.sh "$version" "${{ matrix.arch }}"

      - name: Verify U-API Connect bundle structure
        shell: bash
        run: |
          set -euo pipefail
          test -L "dist/uapi/macos/stage/Applications"
          test "$(readlink "dist/uapi/macos/stage/Applications")" = "/Applications"
          for app in "dist/uapi/macos/stage/U-API Connect.app" "dist/uapi/macos/stage/U-API Connect 设置.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            expected_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")" = "$expected_version"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$expected_version"
            test -x "$app/Contents/MacOS/$executable"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
          done

      - name: Stage validated macOS release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uapi-release-macos-${{ matrix.arch }}
          path: dist/uapi/macos/UAPIConnect-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 3

  latest-json:
    name: Publish validated U-API Connect assets
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    needs:
      - windows-installer
      - macos-dmg
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download validated release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: uapi-release-*
          path: dist/release
          merge-multiple: true

      - name: Verify release assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          windows="dist/release/UAPIConnect-${version}-windows-x64-setup.exe"
          macos_x64="dist/release/UAPIConnect-${version}-macos-x64.dmg"
          macos_arm64="dist/release/UAPIConnect-${version}-macos-arm64.dmg"
          test -f "$windows"
          test -f "$macos_x64"
          test -f "$macos_arm64"
          mapfile -t all_assets < <(find dist/release -maxdepth 1 -type f -print)
          test "${#all_assets[@]}" -eq 3
          if find dist/release -maxdepth 1 -type f -name 'CodexPlusPlus-*' | grep -q .; then
            echo "::error::Generic Codex++ asset must never be published by the U-API workflow"
            exit 1
          fi
          cd dist/release
          sha256sum \
            "UAPIConnect-${version}-windows-x64-setup.exe" \
            "UAPIConnect-${version}-macos-x64.dmg" \
            "UAPIConnect-${version}-macos-arm64.dmg" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Generate latest.json
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const repo = process.env.REPO;
          const tag = process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const releaseDir = "dist/release";
          const assets = fs.readdirSync(releaseDir)
            .filter((name) => /^UAPIConnect-.*\.(exe|dmg)$/.test(name) || name === "SHA256SUMS")
            .sort()
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            body: "U-API Connect release assets",
            assets
          };
          fs.writeFileSync(path.join(releaseDir, "latest.json"), `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat dist/release/latest.json

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: false
